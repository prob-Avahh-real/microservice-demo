server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # 配置随 jar 分发，不依赖启动时的工作目录（见 README 的取舍记录）
          search-locations: classpath:/config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.config: info
