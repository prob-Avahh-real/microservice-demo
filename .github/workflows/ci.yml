name: CI

# 与本地同一套命令：本地绿 = CI 绿（避免「我机器上能跑」）。
# 本工程零外部中间件（不用 Docker/MySQL/Nacos），所以 runner 上直接起 5 个进程即可。

on:
  push:
    branches: [main, master]
    # 必须显式写 tags：只写 branches 的话推 tag **不会触发**流水线，
    # 于是 release job 里那个 startsWith(github.ref, 'refs/tags/') 永远为假（实测踩到过）。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # 保留 concurrency（同 ref 串行，不并行抢资源），但**只对 PR 取消在跑的那次**：
  # 主分支上「新推送取消上一次」会把真正在验证的那次运行半路掐掉（踩过：推一个文档
  # 提交把上一次完整验证 run 取消了，还得重跑）。主分支的推送改为**排队**，两次结果都拿到。
  #
  # 配套的本地预防是 .githooks/pre-push → scripts/ci-guard.sh：
  # CI 在跑时直接拦住 push，而不是事后靠 concurrency 补救。两条腿缺一不可。
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 后端：OS 矩阵
  #
  # 编译 + 22 项单测在 Linux/macOS/Windows 三个系统上都验；
  # 端到端（起 5 个进程 + 8 项断言）只在 Linux/macOS 上验：
  # 它依赖 POSIX 进程管理（nohup + 后台 PID + lsof/端口探活），Git Bash 下不可靠。
  # 与其把 Windows 的 e2e 写成「跳过但看起来成功」，不如把边界显式标出来 ——
  # Windows 这一格只承诺「编译 + 单测通过」。
  # ------------------------------------------------------------------
  backend:
    name: 后端（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false          # 一个平台挂了，另外两个照样出结果，便于对比
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            e2e: true
          - os: macos-latest
            e2e: true
          - os: windows-latest
            e2e: false
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 仓库体检（bash -n / bash 3.2 多字节变量名 / 受控文件不得含本机绝对路径）
        shell: bash
        run: bash scripts/lint-sh.sh

      - name: 编译 + 单测（22 项）
        run: mvn -B -ntp clean install

      - name: 端到端验收（起 5 个进程，8 项断言，退出码即结论）
        if: matrix.e2e
        shell: bash
        run: bash scripts/e2e.sh

      - name: 失败时上传服务日志（排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ matrix.os }}
          path: |
            .run/logs/
            .run/e2e.log
          if-no-files-found: ignore
          retention-days: 5

      - name: 停止服务
        if: always()
        shell: bash
        run: bash scripts/stop-all.sh || true

  # ------------------------------------------------------------------
  # 客户端纯逻辑单测：不依赖后端，与 backend 并行 → 最快反馈
  # ------------------------------------------------------------------
  mobile-unit:
    name: Android 客户端（纯逻辑单测）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 安装依赖（postinstall 会打国内镜像补丁）
        working-directory: mobile
        run: npm ci

      - name: 纯逻辑单测（8 项，注入假 fetch）
        working-directory: mobile
        run: npm run test:unit

  # ------------------------------------------------------------------
  # Android：需要真网关 → **在 job 内构建 jar**，不再跨 job 传 fat jar
  #
  # 为什么不保留 jar 产物：5 个 Spring Boot fat jar 合计 ~327MB（单个 43–85MB）。
  # 每次 CI 上传 + 下载 300MB+ 只为让下一个 job 起服务，不划算。
  # actions/setup-java 的 Maven cache 让 job 内重新 package 只要几十秒。
  # 需要「可下载的 jar」时走 Release（打 tag 时构建并附上）——那才是它该待的地方。
  # ------------------------------------------------------------------
  android:
    name: Android 客户端（链路测试 + APK）
    runs-on: ubuntu-latest
    # 刻意**不**依赖 backend 矩阵：本 job 自带硬件（自行构建 jar + 自跑端到端所需的服务），
    # 让它的结果独立出来 —— 否则 Windows 上一个与本 job 无关的问题会把 APK 产出一起 skip 掉。
    # 需要「全平台都绿才允许发布」的门禁放在 release job 的 needs 上。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 构建可执行 jar（跳过测试：测试已在 backend 矩阵里跑过）
        run: mvn -B -ntp -DskipTests package

      - name: 起后端（链路测试要打真实网关）
        shell: bash
        run: |
          chmod +x scripts/*.sh mobile/scripts/*.sh
          bash scripts/run-all.sh

      - name: 安装客户端依赖
        working-directory: mobile
        run: npm ci

      - name: 客户端测试（8 单测 + 6 项打真实网关的链路测试）
        working-directory: mobile
        run: npm test

      - name: 构建 APK
        working-directory: mobile
        run: npm run build:apk

      - name: 校验 APK 产物（aapt2 真解析 + 包内 web 资源）
        shell: bash
        run: bash mobile/scripts/verify-apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 失败时上传服务日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-service-logs
          path: .run/logs/
          if-no-files-found: ignore
          retention-days: 5

      - name: 停止服务
        if: always()
        shell: bash
        run: bash scripts/stop-all.sh || true

  # ------------------------------------------------------------------
  # CD：打 tag 时把 jar 与 APK 附到 GitHub Release
  #
  # 注意 on.push 里必须同时写 branches 与 tags —— 只写 branches 时推 tag 不会触发流水线。
  # tag 运行时全套 job 照样跑一遍，release 靠 needs 门禁：
  # 只有这个 tag 上「矩阵 + 客户端 + APK」全部通过，才会真的发布 Release。
  # ------------------------------------------------------------------
  release:
    name: CD（打 tag → 发 Release 并附产物）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [backend, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 取回 APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - name: 构建可下载的 jar（jar 只在 Release 提供，日常 CI 不上传）
        run: mvn -B -ntp -DskipTests package

      - name: 发 Release（自动生成说明 + 附 jar/APK）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app-debug.apk
            */target/*.jar
